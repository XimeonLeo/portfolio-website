# Only site/ is published. The backend code, notes and config in this folder stay private.
[build]
  publish = "site"
  # Credit guard: the free plan allows about 20 production deploys a month (15 credits each).
  # A push only deploys when its commit message contains [deploy] (node github/publish.mjs "msg" --deploy).
  # Exit 0 = skip the build, exit 1 = build.
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The secret door must never show up in Google.
[[headers]]
  for = "/door/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# One address for Google: the old netlify.app address forwards to the real domain.
[[redirects]]
  from = "https://simeononabowale.netlify.app/*"
  to = "https://simeononabowale.dev/:splat"
  status = 301
  force = true
